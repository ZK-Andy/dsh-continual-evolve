# Offline recall regression (P5a): monthly re-run of the zero-cost recall
# suite. The external-anchor staleness probe was removed with the synthetic
# four-arm loop (2026-10-20 simplification): no external anchors are scheduled.
name: Offline recall check

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  recall:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Offline recall (zero model cost)
        run: pnpm eval:recall 2>&1 | tee recall.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Offline recall check"
            tail -5 recall.log
          } >> "$GITHUB_STEP_SUMMARY"
