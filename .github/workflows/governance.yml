name: governance

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 校验逻辑住在 scripts/governance-check.ts（可测、可在本地复跑）。
      # 事件负载经环境变量传入，绝不做 shell 插值：issue 正文是不可信 markdown，
      # 代码围栏的反引号会提前闭合引号并把剩余行交给 shell（2026-10-18 实证：exit 2）。
      # 提示级设计：脚本恒返回 0，缺口只以 ::warning:: 注解呈现，不阻断外部贡献者。
      - name: 校验 Issue/PR 输入
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: node scripts/governance-check.ts
